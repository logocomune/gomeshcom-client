name: Nightly

on:
  push:
    branches:
      - develop

permissions:
  contents: read
  packages: write

concurrency:
  group: nightly-develop
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Go tests
        run: go test ./...

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci --prefix web

      - name: Run web tests
        run: npm --prefix web run test:unit -- --run

      - name: Check web types
        run: npm --prefix web run check

  publish:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish nightly image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/gomeshcom:nightly
            ghcr.io/${{ github.repository_owner }}/gomeshcom:nightly-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  cleanup:
    needs: publish
    runs-on: ubuntu-latest
    env:
      OWNER: ${{ github.repository_owner }}
      OWNER_TYPE: ${{ github.event.repository.owner.type == 'Organization' && 'orgs' || 'users' }}
      PACKAGE: gomeshcom
      KEEP: 14
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Delete old nightly images
        shell: bash
        run: |
          set -euo pipefail

          gh api --paginate \
            "/${OWNER_TYPE}/${OWNER}/packages/container/${PACKAGE}/versions?per_page=100" \
            --jq '
              map(select([.metadata.container.tags[]? | startswith("nightly-")] | any))
              | sort_by(.created_at)
              | reverse
              | .['"$KEEP"':][].id
            ' |
          while read -r version_id; do
            gh api --method DELETE \
              "/${OWNER_TYPE}/${OWNER}/packages/container/${PACKAGE}/versions/${version_id}"
          done
